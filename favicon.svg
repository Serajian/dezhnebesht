<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="دژنبشت">
  <title>دژنبشت</title>
  <!-- طاق ساسانی. مختصات همه زوج‌اند: در ۱۶ پیکسل هر ۲ واحد یک پیکسل
       می‌شود، پس لبه‌ها روی مرز پیکسل می‌نشینند و محو نمی‌شوند.
       ضخامت نوار ۸ واحد = ۴ پیکسل در تب مرورگر. -->
  <style>
    /* آبیِ روشن‌تر روی نوار تبِ تاریک، وگرنه کم‌رنگ دیده می‌شود. */
    .arch { fill: #0071e3; }
    @media (prefers-color-scheme: dark) {
      .arch { fill: #409cff; }
    }
  </style>
  <path class="arch" d="M4 28V16A12 12 0 0 1 28 16V28H20V16A4 4 0 0 0 12 16V28Z"/>
</svg>
